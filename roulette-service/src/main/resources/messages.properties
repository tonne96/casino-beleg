roulette.rules.header=Roulette - Spielregeln\n\
  Jede Runde besteht aus genau einem Einsatz und einer Ziehung der\n\
  Gewinnzahl (0 bis 36). Ein Einsatz wird ueber "bet_type" und\n\
  "bet_numbers" angegeben. Was in "bet_numbers" stehen muss, haengt\n\
  vom gewaehlten "bet_type" ab:

bet.SINGLE.description=SINGLE -> bet_numbers: [a], a ist genau eine Zahl von 0 bis 36.
bet.RED_OR_BLACK.description=RED_OR_BLACK -> bet_numbers: [0|1] (0 = Schwarz, 1 = Rot). Ist die 0 die Gewinnzahl, gewinnt das Casino.
bet.ODD_OR_EVEN.description=ODD_OR_EVEN -> bet_numbers: [0|1] (0 = Gerade, 1 = Ungerade). Ist die 0 die Gewinnzahl, gewinnt das Casino.
bet.LOW_OR_HIGH.description=LOW_OR_HIGH -> bet_numbers: [0|1] (0 = Niedrig 1-18, 1 = Hoch 19-36). Ist die 0 die Gewinnzahl, gewinnt das Casino.
bet.DOZEN.description=DOZEN -> bet_numbers: [1|2|3] fuer 1., 2. bzw. 3. Dutzend (1-12, 13-24, 25-36). Ist die 0 die Gewinnzahl, gewinnt das Casino.
bet.COLUMN.description=COLUMN -> bet_numbers: [1|2|3] fuer die 1., 2. bzw. 3. Spalte des Tableaus. Ist die 0 die Gewinnzahl, gewinnt das Casino.
bet.SIX_LINE.description=SIX_LINE -> bet_numbers: [a], a aus 1. Spalte {1,4,7,...,31}. Deckt die 6 Zahlen a bis a+5 ab.
bet.CORNER.description=CORNER -> bet_numbers: [a], a von 1-32 mit a modulo 3 ungleich 0 (1. oder 2. Spalte). Deckt das Viereck a, a+1, a+3, a+4 ab.
bet.STREET.description=STREET -> bet_numbers: [a], a aus 1. Spalte {1,4,7,...,34}. Deckt die 3 Zahlen a bis a+2 ab.
bet.SPLIT.description=SPLIT -> bet_numbers: [a, b], zwei auf dem Tableau echt benachbarte Zahlen, je 0-36. Die 0 ist mit 1, 2 und 3 benachbart.

roulette.rules.footer=Nach der Ziehung wird pro Runde ein einzelner Betrag verbucht:\n\
  bei Gewinn der Nettogewinn (Einsatz * Auszahlungsquote), bei\n\
  Verlust der negative Einsatzbetrag. Der Einsatz wird bei einem Gewinn\n\
  nicht abgezogen und erscheint daher nicht in der Buchung; die\n\
  Statistik-Endpunkte weisen die Auszahlung dagegen brutto aus\n\
  (Einsatz + Nettogewinn).

roulette.chances.header=Gewinnchancen und Auszahlungsquoten
roulette.chances.formula=Berechnung: Nettogewinn = Einsatz * Auszahlungsquote